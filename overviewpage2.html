<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統控制台 | Dashboard</title>
    <style>
        /* CSS Reset & Variables (莫蘭迪科技風格) */
        :root {
            --bg-color: #1a1e24;             /* 莫蘭迪深藍灰 背景 */
            --card-bg: #242933;              /* 卡片背景 */
            --text-primary: #e5e9f0;         /* 主文字：冷灰白 */
            --text-secondary: #8892b0;       /* 次要文字：迷霧藍灰 */
            
            /* 莫蘭迪按鈕色彩設定 */
            --btn-1-bg: #4c566a;             /* 霧面藍灰 */
            --btn-1-border: #7b88a1;
            --btn-2-bg: #5e81ac;             /* 莫蘭迪湛藍 */
            --btn-2-border: #81a1c1;
            --btn-3-bg: #8fbcbb;             /* 灰綠青色 */
            --btn-3-border: #a3be8c;
            
            --glow-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* 科技感背景網格 */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* 響應式容器 */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        /* 標頭與微調飾條 */
        .header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 按鈕列表區域 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 莫蘭迪科技風格按鈕 */
        .tech-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            outline: none;
            border: 1px solid transparent;
        }

        /* 按鈕各自色系配置 (帶莫蘭迪灰色調) */
        .btn-setting {
            background-color: rgba(76, 86, 106, 0.3);
            border-color: rgba(123, 136, 161, 0.4);
        }

        .btn-test {
            background-color: rgba(94, 129, 172, 0.3);
            border-color: rgba(129, 161, 193, 0.4);
        }

        .btn-sync {
            background-color: rgba(143, 188, 187, 0.25);
            border-color: rgba(163, 190, 140, 0.4);
        }

        /* Hover & Focus 懸浮與科技感光澤效果 */
        .tech-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .btn-setting:hover {
            background-color: rgba(76, 86, 106, 0.6);
            border-color: var(--btn-1-border);
        }

        .btn-test:hover {
            background-color: rgba(94, 129, 172, 0.6);
            border-color: var(--btn-2-border);
        }

        .btn-sync:hover {
            background-color: rgba(143, 188, 187, 0.5);
            border-color: var(--btn-3-border);
        }

        .tech-btn:active {
            transform: translateY(0);
        }

        /* 右側微型科技圖示箭頭 */
        .tech-btn::after {
            content: '→';
            font-family: monospace;
            font-size: 1.2rem;
            opacity: 0.6;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .tech-btn:hover::after {
            opacity: 1;
            transform: translateX(4px);
        }

        /* 響應式斷點微調 (手機端) */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .tech-btn {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>系統控制</h1>
            <p>System Control Panel</p>
        </div>

        <div class="button-group">
            <!-- 1. 設定 -->
            <a href="https://docs.google.com/spreadsheets/d/1TlJc6P_najdTVPPx4TyOhpTuL4WpHIf22lVt0zikzFw/edit?gid=479194265#gid=479194265" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="tech-btn btn-setting">
                <span>公休日表格檢視</span>
            </a>

            <!-- 2. 測試 -->
            <a href="https://cpusystemcall.github.io/off_days_viewer.html" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="tech-btn btn-test">
                <span>公休日列表整理</span>
            </a>

            <!-- 3. 同步 -->
            <a href="https://handlebar-data-pranker.ngrok-free.dev/form/eb58a41a-928f-4149-8d66-0e2b227bec80" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="tech-btn btn-sync">
                <span>公休日手動新增</span>
            </a>
        </div>
    </div>

</body>
</html>
